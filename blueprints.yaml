name: Hardcover
slug: hardcover
type: plugin
version: 1.1.1
description: Show your Hardcover.app "Currently reading" books on your site.
icon: book
author:
  name: Greg Bowers
homepage: https://github.com/gbbowers/grav-plugin-hardcover
bugs: https://github.com/gbbowers/grav-plugin-hardcover/issues
keywords: hardcover, books, reading, widget
license: MIT
compatibility:
  grav: ['2.0']
dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    token:
      type: password
      label: PLUGIN_HARDCOVER.TOKEN
      help: PLUGIN_HARDCOVER.TOKEN_HELP
    limit:
      type: number
      label: PLUGIN_HARDCOVER.LIMIT
      default: 5
      validate:
        type: int
        min: 1
        max: 25
    cache_minutes:
      type: number
      label: PLUGIN_HARDCOVER.CACHE_MINUTES
      help: PLUGIN_HARDCOVER.CACHE_MINUTES_HELP
      default: 60
      validate:
        type: int
        min: 1
    heading:
      type: text
      label: PLUGIN_HARDCOVER.HEADING
      help: PLUGIN_HARDCOVER.HEADING_HELP
    built_in_css:
      type: toggle
      label: PLUGIN_HARDCOVER.BUILT_IN_CSS
      help: PLUGIN_HARDCOVER.BUILT_IN_CSS_HELP
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

name: Hardcover
slug: hardcover
type: plugin
version: 1.1.0
description: Show your Hardcover.app "Currently reading" books on your site.
icon: book
author:
  name: Greg Bowers
homepage: https://github.com/gbbowers/grav-plugin-hardcover
bugs: https://github.com/gbbowers/grav-plugin-hardcover/issues
keywords: hardcover, books, reading, widget
license: MIT
dependencies:
  - { name: grav, version: '>=1.7.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Plugin status
      highlight: 1
      default: 1
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool
    token:
      type: password
      label: API token
      help: From hardcover.app → Settings → API. With or without the "Bearer " prefix.
    limit:
      type: number
      label: Max books
      default: 5
      validate:
        type: int
        min: 1
        max: 25
    cache_minutes:
      type: number
      label: Cache (minutes)
      default: 60
      validate:
        type: int
        min: 1
    heading:
      type: text
      label: Heading
      default: Currently reading
    built_in_css:
      type: toggle
      label: Use built-in CSS
      default: 1
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool
